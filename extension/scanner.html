<!doctype html><html lang="en"><head><meta charset="utf-8"><title>SafeScan AI</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#0b1020;color:#e8ecf8}header{padding:14px 16px;font-weight:800;border-bottom:1px solid #25304d}
.tabs{display:flex;gap:6px;padding:12px 16px 0}.tabs button{flex:1;border:1px solid #25304d;background:none;color:inherit;border-radius:10px;padding:9px 4px;min-height:44px;cursor:pointer}.tabs button[aria-selected=true]{background:#2f5bff;border-color:#2f5bff}
main{padding:16px}label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}input,textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid #25304d;background:#131a2e;color:inherit}textarea{min-height:120px;resize:vertical}
.btn{border:1px solid #25304d;background:#131a2e;color:inherit;padding:10px 16px;border-radius:12px;font-weight:600;min-height:44px;cursor:pointer;margin:8px 8px 0 0}.p{background:linear-gradient(135deg,#2f5bff,#7c3aed);border:0}
:focus-visible{outline:3px solid #fff;outline-offset:2px}.score{font-size:2.2rem;font-weight:800}.bar{height:8px;background:#25304d;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%}
.badge{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:700}.err{color:#f87171;font-weight:600}.mu{color:#9aa5c0;font-size:13px}code{word-break:break-all}
.vid{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3;margin:10px 0}.vid video{width:100%;height:100%;object-fit:cover}.fr{position:absolute;inset:18%;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35);overflow:hidden}.fr:after{content:"";position:absolute;left:0;right:0;height:3px;background:#2f5bff;animation:s 2s infinite alternate}@keyframes s{from{top:0}to{top:100%}}
.drop{border:2px dashed #25304d;border-radius:14px;padding:22px;text-align:center;margin-top:10px}.drop.h{border-color:#2f5bff}.res{margin-top:16px}
</style></head><body><header>🛡️ SafeScan AI</header>
<div class="tabs" role="tablist"><button role="tab" data-t="link">🔗 Links</button><button role="tab" data-t="sms">💬 SMS</button><button role="tab" data-t="email">📧 Mail</button><button role="tab" data-t="qr">🔳 QR</button></div>
<main id="m"></main><script src="jsQR.js"></script><script src="analyze.js"></script><script src="scanner.js"></script></body></html>

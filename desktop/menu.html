<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden;font:13px/1.3 "Segoe UI",system-ui,sans-serif;user-select:none}
.p{margin:2px;background:#131a2e;color:#e8ecf8;border:1px solid #25304d;border-radius:14px;padding:6px}
.h{padding:6px 10px 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9aa5c0}
.it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;padding:8px 10px;border-radius:9px;cursor:pointer;font:inherit}
.it:hover{background:#1c2540}.it small{display:block;color:#9aa5c0;font-size:11px}.it .k{margin-left:auto;color:#6c7899;font-size:11px}
.sub{padding-left:22px}hr{border:0;border-top:1px solid #25304d;margin:4px 6px}.q{color:#fca5a5}</style></head><body>
<div class="p" id="p">
<div class="h">SafeScan AI</div>
<button class="it" data-a="link">🔗 <span>Links<small>Check a URL</small></span></button>
<button class="it" data-a="sms">💬 <span>SMS<small>Scan a message</small></span></button>
<button class="it" data-a="email">📧 <span>Mail<small>Check an email</small></span></button>
<button class="it" data-x="qr">🔳 <span>QR<small>Camera, upload or snip</small></span><span class="k" id="arr">▸</span></button>
<div id="qr" hidden>
<button class="it sub" data-a="qr">📷 Camera / Upload</button>
<button class="it sub" data-a="snip">✂️ Snip QR on screen<span class="k">Ctrl+Shift+Q</span></button>
</div>
<button class="it" data-a="sel">📝 <span>Scan selected text<small>Select text in any app first</small></span><span class="k">Ctrl+Shift+S</span></button>
<hr>
<button class="it" data-a="dashboard">📊 Dashboard</button>
<button class="it" data-a="help">🚨 Help <small style="display:inline;margin-left:4px">(already clicked?)</small></button>
<button class="it" data-a="reset">↺ Reset shield position</button>
<button class="it" data-a="hide">🚫 Hide shield</button>
<button class="it q" data-a="quit">⏻ Quit</button>
</div>
<script>
const p=document.getElementById("p"),qr=document.getElementById("qr");let entered=false,leaveT=0,idleT=0;
const h=()=>Math.ceil(p.getBoundingClientRect().height)+4;
const close=()=>{clearTimeout(leaveT);clearTimeout(idleT);ss.send("menu-close")};
ss.on("menu-open",()=>{qr.hidden=true;document.getElementById("arr").textContent="▸";entered=false;clearTimeout(leaveT);clearTimeout(idleT);
 requestAnimationFrame(()=>{ss.send("menu-size",h());idleT=setTimeout(()=>{if(!entered)close()},3500)})});
document.addEventListener("mouseenter",()=>{entered=true;clearTimeout(leaveT);clearTimeout(idleT)});
document.addEventListener("mousemove",()=>{if(!entered){entered=true;clearTimeout(idleT)}clearTimeout(leaveT)});
document.addEventListener("mouseleave",()=>{clearTimeout(leaveT);leaveT=setTimeout(close,600)});
p.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.x){qr.hidden=!qr.hidden;document.getElementById("arr").textContent=qr.hidden?"▸":"▾";requestAnimationFrame(()=>ss.send("menu-resize",h()));return}
 clearTimeout(leaveT);clearTimeout(idleT);ss.send("menu-action",b.dataset.a)});
</script></body></html>
